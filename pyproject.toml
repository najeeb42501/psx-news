[project]
name = "psx-pipeline"
version = "0.1.0"
description = "ShareKhabar pipeline: ingest, process, compose and publish PSX announcements"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pillow>=10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pytesseract>=0.3.13",
    "pyyaml>=6",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
