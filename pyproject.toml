[project]
name = "psx-pipeline"
version = "0.1.0"
description = "ShareKhabar pipeline: ingest, process, compose and publish PSX announcements"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
